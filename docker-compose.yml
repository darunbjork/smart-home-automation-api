services:
  api:
    container_name: smart-home-api
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-home-api:v1.0.0
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - mongo

  mongo:
    container_name: smart-home-db
    image: mongo:6.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
